<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Page information and settings -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG and JavaScript</title>

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="./style.css">

  <!-- Custom fonts -->
  <link href="https://fonts.cdnfonts.com/css/gotenburg-a" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=tanker@400&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=nippo@400,500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Fixed bar containing the panel buttons -->
  <div class="fixed-white-bar">
    <h2 id="characterButton" role="button" tabindex="0" aria-label="Open character stats">🎲</h2>
    <h2 id="inventoryButton" role="button" tabindex="0" aria-label="Open inventory">👜</h2>
    <h2 id="equipmentButton" role="button" tabindex="0" aria-label="Open equipment">⚔️</h2>
  </div>

  <!-- Side panel for stats, inventory, and equipment -->
  <div class="side-panel" id="sidePanel">
    <div id="character">
      <div id="characterBox">

        <!-- Character stats -->
        <div id="characterStats" hidden>
          <p class="panel-title">Stats</p>

          <div class="panel-body">
            <img
              id="characterImage"
              src="https://drive.google.com/thumbnail?id=1VQjrKz_tkQv_scSkIEkOskj8GjuvgL-4&sz=w300"
              referrerpolicy="no-referrer"
              alt="RPG character"
            >

            <p id="name">Name:</p>
            <p id="realm">Realm:</p>
            <p id="class">Class:</p>
            <p id="level">Level:</p>
            <p id="race">Race:</p>
            <p id="hp">HP:</p>
            <p id="alive">Alive:</p>
            <p id="weapon-status">Has Weapon:</p>
            <p id="damageModefier">Damage Modifier:</p>
            <p id="xp">Experience:</p>
          </div>
        </div>

        <!-- Inventory and its item counter -->
        <div id="inventoryContent" hidden>
          <div class="inventory-header">
            <p class="panel-title">Inventory</p>
            <p id="inventoryCounter">0/5</p>
          </div>

          <div class="panel-body">
            <div class="inventoryItem">
              <label for="inventoryItem1">Slot 1:</label>
              <input type="text" id="inventoryItem1" placeholder="Type item">
            </div>

            <div class="inventoryItem">
              <label for="inventoryItem2">Slot 2:</label>
              <input type="text" id="inventoryItem2" placeholder="Type item">
            </div>

            <div class="inventoryItem">
              <label for="inventoryItem3">Slot 3:</label>
              <input type="text" id="inventoryItem3" placeholder="Type item">
            </div>

            <div class="inventoryItem">
              <label for="inventoryItem4">Slot 4:</label>
              <input type="text" id="inventoryItem4" placeholder="Type item">
            </div>

            <div class="inventoryItem">
              <label for="inventoryItem5">Slot 5:</label>
              <input type="text" id="inventoryItem5" placeholder="Type item">
            </div>
          </div>
        </div>

        <!-- Equipment slots -->
        <div id="equipmentContent" hidden>
          <p class="panel-title">Equipment</p>

          <div class="panel-body">
            <div class="equipmentItem">
              <label for="equipmentWeapon">⚔️ Weapon</label>
              <input type="text" id="equipmentWeapon" placeholder="Type weapon">
            </div>

            <div class="equipmentItem">
              <label for="equipmentSideWeapon">🔪 Side Weapon</label>
              <input type="text" id="equipmentSideWeapon" placeholder="Type side weapon">
            </div>

            <div class="equipmentItem">
              <label for="equipmentHead">🪖 Head</label>
              <input type="text" id="equipmentHead" placeholder="Type head equipment">
            </div>

            <div class="equipmentItem">
              <label for="equipmentArmor">🛡️ Armor</label>
              <input type="text" id="equipmentArmor" placeholder="Type armor">
            </div>

            <div class="equipmentItem">
              <label for="equipmentArmware">🦾 Armwear</label>
              <input type="text" id="equipmentArmware" placeholder="Type armwear">
            </div>

            <div class="equipmentItem">
              <label for="equipmentRing">💍 Ring</label>
              <input type="text" id="equipmentRing" placeholder="Type ring">
            </div>

            <div class="equipmentItem">
              <label for="equipmentTalisman">📿 Talisman</label>
              <input type="text" id="equipmentTalisman" placeholder="Type talisman">
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Main page content -->
  <div id="pageContent">
    <h1>RPG Creation</h1>

    <div id="gameStats">
      <div id="encounter">
        <div id="encounterMain">

          <!-- Enemy and combat controls -->
          <div id="boss">
            <h2>Enemy 👾</h2>

            <p>
              <label for="bossName">Name:</label>
              <input type="text" id="bossName" placeholder="Enter enemy name">
            </p>

            <p>
              <label for="bossHP">Health:</label>
              <input type="number" id="bossHP" placeholder="Enter HP" min="0">
            </p>

            <h3>Actions:</h3>

            <div id="damageControls">
              <p>
                <label for="damageDealt">Damage dealt:</label>
                <input type="number" id="damageDealt" placeholder="Damage dealt" min="0">
              </p>

              <p>
                <label for="damageReceived">Damage received:</label>
                <input type="number" id="damageReceived" placeholder="Damage received" min="0">
              </p>

              <p>
                <label for="xpGained">XP gained (if monster beaten):</label>
                <input type="number" id="xpGained" placeholder="XP gained" min="0">
              </p>

              <p>
                <button id="applyDamageButton" class="glow-on-hover" type="button">
                  APPLY DAMAGE / RESOLVE
                </button>
              </p>
            </div>

            <p id="actionResult" aria-live="polite"></p>
          </div>

          <!-- NPC and XP rewards -->
          <div id="npc">
            <h2>NPC 👤</h2>

            <p>
              <label for="npcName">Name:</label>
              <input type="text" id="npcName" placeholder="Enter NPC name">
            </p>

            <p>
              <label for="npcXPGain">XP gained:</label>
              <input type="number" id="npcXPGain" placeholder="XP amount" min="0">
            </p>

            <p>
              <button id="applyNpcXPButton" class="glow-on-hover" type="button">
                APPLY XP TO PLAYER
              </button>
            </p>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Game logic and button interactions -->
  <script src="./script.js"></script>
</body>
</html>
